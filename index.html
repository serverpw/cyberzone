<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELAMAT! Kamu Tertipu!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Bold Cyber-Security Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050508;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Cyber Background Grid */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(239, 68, 68, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(239, 68, 68, 0.07) 1px, transparent 1px);
        }

        /* Scanline Overlay Effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.4) 50%,
                rgba(0, 0, 0, 0.4)
            );
            background-size: 100% 4px;
        }

        /* Glowing Red Card Frame */
        .cyber-card {
            background: rgba(12, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #ef4444;
            box-shadow: 
                0 0 30px rgba(239, 68, 68, 0.35),
                inset 0 0 25px rgba(239, 68, 68, 0.15);
        }

        /* Glitch Animation Effect for Heading */
        .glitch-text {
            position: relative;
            display: inline-block;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 20px rgba(220, 38, 38, 0.6);
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .glitch-text::before {
            left: -2px;
            text-shadow: 2px 0 #3b82f6;
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: 2px;
            text-shadow: -2px 0 #ef4444;
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(40px, 9999px, 60px, 0); }
            40% { clip: rect(20px, 9999px, 50px, 0); }
            60% { clip: rect(70px, 9999px, 90px, 0); }
            80% { clip: rect(30px, 9999px, 40px, 0); }
            100% { clip: rect(60px, 9999px, 80px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(30px, 9999px, 10px, 0); }
            25% { clip: rect(50px, 9999px, 70px, 0); }
            50% { clip: rect(10px, 9999px, 40px, 0); }
            75% { clip: rect(80px, 9999px, 20px, 0); }
            100% { clip: rect(40px, 9999px, 60px, 0); }
        }

        /* Pulsing Red Warning Glow */
        .pulse-warning {
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative select-none cyber-grid">

    <!-- Interactive Canvas Particles Background -->
    <canvas id="cyberCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Scanline Screen Effect -->
    <div class="fixed inset-0 pointer-events-none z-10 scanlines opacity-40"></div>

    <!-- Glowing Ambient Lights -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-red-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-3xl h-48 bg-red-900/30 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Main Container Card -->
    <div class="relative z-20 w-full max-w-xl mx-auto my-auto py-6">
        
        <!-- Cyber Shield Header Graphic -->
        <div class="relative w-full flex justify-center mb-6 pointer-events-none">
            <div class="relative flex items-center justify-center">
                <!-- Outer Glowing Skull / Cyber Badge -->
                <div class="w-24 h-24 md:w-28 md:h-28 rounded-2xl bg-black/80 border-2 border-red-500 flex items-center justify-center shadow-[0_0_30px_rgba(239,68,68,0.6)] pulse-warning">
                    <svg class="w-14 h-14 md:w-16 md:h-16 text-red-500 fill-current drop-shadow-[0_0_12px_rgba(239,68,68,0.8)]" viewBox="0 0 24 24">
                        <!-- Cyber Skull & Crossbones Icon -->
                        <path d="M12 2C6.48 2 2 6.48 2 12c0 3.69 2.01 6.91 5 8.65V22h10v-1.35c2.99-1.74 5-4.96 5-8.65 0-5.52-4.48-10-10-10zm-3 9c.83 0 1.5.67 1.5 1.5S9.83 14 9 14s-1.5-.67-1.5-1.5S8.17 11 9 11zm6 0c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5.67-1.5 1.5-1.5zm-5 6h4v1.5h-4V17z"/>
                    </svg>
                </div>
                <!-- Warning Corner Brackets -->
                <div class="absolute -top-2 -left-2 w-4 h-4 border-t-2 border-l-2 border-red-500"></div>
                <div class="absolute -top-2 -right-2 w-4 h-4 border-t-2 border-r-2 border-red-500"></div>
                <div class="absolute -bottom-2 -left-2 w-4 h-4 border-b-2 border-l-2 border-red-500"></div>
                <div class="absolute -bottom-2 -right-2 w-4 h-4 border-b-2 border-r-2 border-red-500"></div>
            </div>
        </div>

        <!-- MAIN CYBER CARD DISPLAY -->
        <div class="cyber-card rounded-2xl p-8 md:p-12 text-center relative overflow-hidden">
            
            <!-- Top Tech Status Header -->
            <div class="flex items-center justify-between text-xs tracking-widest text-red-400 font-orbitron uppercase mb-6 opacity-80 border-b border-red-900/50 pb-3">
                <span class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                    SECURITY BREACH
                </span>
                <span>CODE: PHISH_DETECTED</span>
            </div>

            <!-- Headline "SELAMAT! Kamu Tertipu!" -->
            <div class="mb-6 relative">
                <h1 data-text="SELAMAT! Kamu Tertipu!" class="glitch-text font-orbitron text-3xl sm:text-4xl md:text-5xl font-black text-red-500 tracking-wider leading-tight">
                    SELAMAT!<br>Kamu Tertipu!
                </h1>
            </div>

            <!-- Subtext 1 -->
            <p class="text-slate-200 font-bold text-lg md:text-xl mb-4 max-w-md mx-auto leading-relaxed tracking-wide">
                Ternyata kamu sudah terjebak dengan pesan palsu.
            </p>

            <!-- Subtext 2 -->
            <p class="text-slate-400 font-medium text-sm md:text-base mb-8 max-w-md mx-auto leading-relaxed">
                Jangan mudah percaya dengan pesan, tautan, atau hadiah yang mencurigakan, ya!
            </p>

            <!-- Cyber Shield / Lock Badge Bottom Center -->
            <div class="flex items-center justify-center gap-4 max-w-xs mx-auto pt-4 border-t border-red-900/40">
                <div class="h-[1px] bg-gradient-to-r from-transparent to-red-500 flex-1"></div>
                
                <!-- Shield & Lock Badge Icon -->
                <div class="w-12 h-12 rounded-xl bg-red-950/80 border border-red-500/80 flex items-center justify-center text-red-400 shadow-[0_0_15px_rgba(239,68,68,0.4)]">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6a2.5 2.5 0 0 1 2.5 2.5V11h.5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h.5V9.5A2.5 2.5 0 0 1 12 7zm0 1.5A1 1 0 0 0 11 9.5V11h2V9.5A1 1 0 0 0 12 8.5z"/>
                    </svg>
                </div>

                <div class="h-[1px] bg-gradient-to-l from-transparent to-red-500 flex-1"></div>
            </div>

        </div>

    </div>

    <!-- Canvas Cyber Particle Script -->
    <script>
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');

        let particles = [];
        const particleCount = 65;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.alpha = Math.random() * 0.7 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(239, 68, 68, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.onload = animate;
    </script>
</body>
</html>
